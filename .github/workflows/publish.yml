name: Publish npm package

# Runs at the immutable release tag the private controller created. A manual
# retry at the same tag skips publishing only when the existing npm artifact
# matches the built package and this commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-glam-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish CLI
    if: vars.CLI_RELEASE_PUBLISH_ENABLED == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm for trusted publishing
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate the release ref
        run: node scripts/release-cli.mjs validate

      - name: Build package
        run: npm run build

      - name: Publish or confirm the existing artifact
        run: node scripts/release-cli.mjs publish

      - name: Verify installation, signatures and provenance
        run: node scripts/release-cli.mjs verify

      - name: Complete the public GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-cli.mjs release
